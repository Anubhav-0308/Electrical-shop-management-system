<header class="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand" style="display: flex; align-items: center; gap: 10px;">
      <img src="/src/images/logo.png" alt="Shri Krishna Lighthouse Logo" style="height: 40px; width: auto; border-radius: 4px;" />
      <span class="brand-text">
        <strong id="brand-shop-name" style="display: none;">Shri Krishna Lighthouse Bhonti</strong>
        <small style="display: none;">Electrical &amp; Electronics</small>
      </span>
    </a>

    <!-- Mobile hamburger -->
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" id="main-nav">
      <a href="/index.html" data-nav="home">Home</a>
      <a href="/about.html" data-nav="about">About</a>
      <a href="/products.html" data-nav="products">Products</a>
      <a href="/contact.html" data-nav="contact">Contact</a>
    </nav>

    <div class="header-search">
      <input type="text" id="global-search" placeholder="Search switches, sockets, wires…" autocomplete="off" />
      <button id="global-search-btn" aria-label="Search">🔍</button>
      <div id="global-search-results" class="search-results hidden"></div>
    </div>

    <div class="header-actions">
      <button id="theme-btn" class="icon-btn" title="Toggle Theme">🌓</button>
      <button id="cart-nav-btn" class="icon-btn open-cart-btn" title="View Cart">
        🛒<span id="header-cart-count" class="badge hidden">0</span>
      </button>
      <button id="notif-btn" class="icon-btn" title="Notifications">
        🔔<span id="notif-count" class="badge hidden">0</span>
      </button>
      <a id="dashboard-link" href="/login.html" class="btn btn-outline">Login</a>
      <button id="header-logout-btn" class="btn btn-outline hidden" style="margin-left: 8px;">Logout</button>
    </div>
  </div>

  <div id="notif-panel" class="notif-panel hidden"></div>
</header>

<div id="cart-overlay" class="overlay hidden"></div>
<div id="cart-drawer" class="cart-drawer">
  <div class="cart-header">
    <strong>Your Bill</strong>
    <button id="close-cart" class="icon-btn">✕</button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cart-total">₹0</span></div>
    <button class="btn btn-primary btn-block" id="checkout-btn">Generate Bill</button>
  </div>
</div>

<!-- Checkout modal -->
<div id="checkout-overlay" class="overlay hidden"></div>
<div id="checkout-modal" class="hidden" style="position:fixed;z-index:130;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:92vw;">
  <div class="card">
    <h3>Enter your details</h3>
    <div class="form-group"><label>Full Name</label><input type="text" id="co-name" /></div>
    <div class="form-group"><label>Phone Number *</label><input type="tel" id="co-phone" required /></div>
    <div class="form-group"><label>Email *</label><input type="email" id="co-email" required /></div>
    <div class="form-group"><label>Address (optional)</label><input type="text" id="co-address" /></div>
    <div class="form-group">
      <label>Payment Method</label>
      <select id="co-payment"><option value="cod">Cash / Pay at shop</option><option value="online">Online Payment</option></select>
    </div>
    <button class="btn btn-primary btn-block" id="confirm-checkout">Confirm &amp; Generate Bill</button>
    <div id="checkout-msg" class="form-msg"></div>
  </div>
</div>

<!-- Bill / invoice result modal -->
<div id="bill-overlay" class="overlay hidden"></div>
<div id="bill-modal" class="hidden" style="position:fixed;z-index:130;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:92vw;">
  <div class="card">
    <h3>✅ Bill Generated</h3>
    <p id="bill-summary" class="mono"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a id="bill-invoice-link" class="btn btn-outline" target="_blank">Download Invoice (PDF)</a>
      <button id="bill-pay-btn" class="btn btn-primary">Pay Online</button>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top:12px;" id="bill-close">Close</button>
  </div>
</div>
