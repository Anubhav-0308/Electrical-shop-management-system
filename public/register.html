<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Shri Krishna Lighthouse Bhonti</title>
<meta name="description" content="Create a free customer account at Shri Krishna Lighthouse Bhonti to track your bills and orders." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="layout-header"></div>

<main>
  <div class="auth-wrap container">
    <div class="card">
      <h2>Create your account</h2>
      <form id="register-form">
        <div class="form-group"><label for="r-name">Full Name</label><input type="text" id="r-name" required autocomplete="name" /></div>
        <div class="form-group"><label for="r-email">Email</label><input type="email" id="r-email" required autocomplete="email" /></div>
        <div class="form-group"><label for="r-phone">Phone Number</label><input type="tel" id="r-phone" required autocomplete="tel" /></div>
        <div class="form-group"><label for="r-password">Password <small style="color:var(--muted)">(min 6 characters)</small></label><input type="password" id="r-password" required minlength="6" autocomplete="new-password" /></div>
        <button class="btn btn-primary btn-block" type="submit" id="register-btn">Create Account</button>
        <div style="text-align:center;margin:16px 0;color:var(--muted);font-size:0.85rem;">OR</div>
        <button type="button" class="btn btn-outline btn-block" id="google-login-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18" height="18" alt="Google Logo" />
          Sign in with Google
        </button>
        <div id="register-msg" class="form-msg"></div>
      </form>
      <p style="margin-top:16px;font-size:0.88rem;">Already have an account? <a href="/login.html" style="color:var(--amber);">Login</a></p>
    </div>
  </div>
</main>

<div id="layout-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("register-btn");
  const msgEl = document.getElementById("register-msg");
  msgEl.textContent = ""; msgEl.className = "form-msg";
  btn.disabled = true;
  btn.textContent = "Creating account…";
  try {
    const data = await api("/auth/register", {
      method: "POST",
      body: {
        name: document.getElementById("r-name").value,
        email: document.getElementById("r-email").value,
        phone: document.getElementById("r-phone").value,
        password: document.getElementById("r-password").value,
      },
    });
    setSession(data.token, data.user);
    toast(`Welcome, ${data.user.name}!`, "success");
    location.href = "/customer-dashboard.html";
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.add("error");
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
});

// Google Login Mock
document.getElementById("google-login-btn").addEventListener("click", async () => {
  const email = prompt("Enter your Google Email (Demo Mock):");
  if (!email) return;

  const mockToken = btoa(JSON.stringify({ alg: "none" })) + "." + btoa(JSON.stringify({ sub: "g-" + Date.now(), email, name: email.split("@")[0] })) + ".";
  
  try {
    const data = await api("/auth/google", { method: "POST", body: { token: mockToken } });
    setSession(data.token, data.user);
    toast(`Welcome back, ${data.user.name}!`, "success");
    location.href = data.user.role === "admin" ? "/admin-dashboard.html" : "/customer-dashboard.html";
  } catch (err) {
    alert("Google login failed: " + err.message);
  }
});
</script>
</body>
</html>
