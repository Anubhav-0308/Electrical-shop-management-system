<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Shri Krishna Lighthouse Bhonti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="layout-header"></div>

<main>
  <div class="auth-wrap container">
    <div class="card">
      <h2>Forgot Password</h2>
      <p style="color:var(--muted);font-size:0.85rem;">Enter your email address to receive a 6-digit OTP to reset your password.</p>
      
      <!-- Step 1: Request OTP -->
      <form id="request-otp-form">
        <div class="form-group">
          <label for="f-email">Email Address</label>
          <input type="email" id="f-email" placeholder="Enter email address" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="request-otp-btn">Send OTP</button>
        <div id="request-msg" class="form-msg"></div>
      </form>

      <!-- Step 2: Reset Password -->
      <form id="reset-password-form" class="hidden" style="margin-top:20px;">
        <hr style="margin-bottom:20px;border-color:var(--surface-3);">
        <div class="form-group">
          <label for="f-otp">Enter OTP (Check server console for demo)</label>
          <input type="text" id="f-otp" placeholder="6-digit OTP" required />
        </div>
        <div class="form-group">
          <label for="f-new-password">New Password</label>
          <input type="password" id="f-new-password" placeholder="Min 6 characters" required minlength="6" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="reset-btn">Reset Password</button>
        <div id="reset-msg" class="form-msg"></div>
      </form>

      <p style="margin-top:16px;font-size:0.88rem;"><a href="/login.html" style="color:var(--amber);">Back to Login</a></p>
    </div>
  </div>
</main>

<div id="layout-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
let currentEmail = "";

document.getElementById("request-otp-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("request-otp-btn");
  const msgEl = document.getElementById("request-msg");
  msgEl.textContent = ""; msgEl.className = "form-msg";
  
  const email = document.getElementById("f-email").value.trim();
  if(!email) return;

  btn.disabled = true;
  btn.textContent = "Sending…";
  
  try {
    const data = await api("/auth/forgot-password", {
      method: "POST",
      body: { email },
    });
    msgEl.textContent = data.message;
    msgEl.classList.add("success");
    currentEmail = email;
    document.getElementById("f-email").disabled = true;
    document.getElementById("reset-password-form").classList.remove("hidden");
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Send OTP";
  }
});

document.getElementById("reset-password-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reset-btn");
  const msgEl = document.getElementById("reset-msg");
  msgEl.textContent = ""; msgEl.className = "form-msg";
  
  btn.disabled = true;
  btn.textContent = "Resetting…";
  
  try {
    const data = await api("/auth/reset-password", {
      method: "POST",
      body: {
        email: currentEmail,
        otp: document.getElementById("f-otp").value.trim(),
        newPassword: document.getElementById("f-new-password").value,
      },
    });
    msgEl.textContent = data.message;
    msgEl.classList.add("success");
    
    // Redirect to login after 2 seconds
    setTimeout(() => {
      location.href = "/login.html";
    }, 2000);
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.add("error");
    btn.disabled = false;
    btn.textContent = "Reset Password";
  }
});
</script>
</body>
</html>
