<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Shri Krishna Lighthouse Bhonti</title>
<meta name="description" content="Login to your Shri Krishna Lighthouse Bhonti account to manage your bills, orders and reviews." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="layout-header"></div>

<main>
  <div class="auth-wrap container">
    <div class="card">
      <h2>Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="l-email">Email, Username, or Mobile Number</label>
          <input type="text" id="l-email" placeholder="Enter email, username, or mobile" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="l-password">Password</label>
          <input type="password" id="l-password" required autocomplete="current-password" />
        </div>
        <div style="text-align:right;margin-top:-10px;margin-bottom:12px;">
          <a href="/forgot-password.html" style="font-size:0.85rem;color:var(--amber);text-decoration:none;">Forgot Password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Login</button>
        <div style="text-align:center;margin:16px 0;color:var(--muted);font-size:0.85rem;">OR</div>
        <button type="button" class="btn btn-outline btn-block" id="google-login-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18" height="18" alt="Google Logo" />
          Sign in with Google
        </button>
        <div id="login-msg" class="form-msg"></div>
      </form>
      <p style="margin-top:16px;font-size:0.88rem;">New customer? <a href="/register.html" style="color:var(--amber);">Create an account</a></p>
    </div>
  </div>
</main>

<div id="layout-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const msgEl = document.getElementById("login-msg");
  msgEl.textContent = ""; msgEl.className = "form-msg";
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        email: document.getElementById("l-email").value.trim(),
        password: document.getElementById("l-password").value,
      },
    });
    setSession(data.token, data.user);
    toast(`Welcome back, ${data.user.name}!`, "success");
    location.href = data.user.role === "admin" ? "/admin-dashboard.html" : "/customer-dashboard.html";
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.add("error");
    btn.disabled = false;
    btn.textContent = "Login";
  }
});

// Google Login Mock
document.getElementById("google-login-btn").addEventListener("click", async () => {
  const email = prompt("Enter your Google Email (Demo Mock):");
  if (!email) return;

  const mockToken = btoa(JSON.stringify({ alg: "none" })) + "." + btoa(JSON.stringify({ sub: "g-" + Date.now(), email, name: email.split("@")[0] })) + ".";
  
  try {
    const data = await api("/auth/google", { method: "POST", body: { token: mockToken } });
    setSession(data.token, data.user);
    toast(`Welcome back, ${data.user.name}!`, "success");
    location.href = data.user.role === "admin" ? "/admin-dashboard.html" : "/customer-dashboard.html";
  } catch (err) {
    alert("Google login failed: " + err.message);
  }
});
</script>
</body>
</html>
